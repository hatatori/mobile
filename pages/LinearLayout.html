<h1>&lt;LinearLayout/></h1>
<p>O LinearLayout é um componente do Android usado para organizar elementos na tela de forma linear, podendo colocá-los na vertical, um abaixo do outro, ou na horizontal, um ao lado do outro.</p>

<h2>Orientation</h2>
 
<h3>Vertical</h3>

    <div class="LinearLayout-square"></div>
    <div class="LinearLayout-square"></div>

<h1>&lt;TextView/></h1>
<p>O TextView é um componente do Android usado para exibir textos na tela para o usuário, permitindo personalizar
    aspectos como tamanho da fonte, cor, estilo e alinhamento.</p>

    
<hr>

<section class="options">

    <button class="btn btnOption" value="xml">XML</button>
    <button class="btn btnOption" value="jetpack">JETPACK</button>

    <div class="optionItem xml" style="display: block;">
        <h2>XML</h2>
        <main lang="xml" class="code" src="./xml/TextView.xml"></main>
    </div>

    <div class="optionItem jetpack">
        <h2>JETPACK COMPOSE</h2>
        <main lang="kotlin" class="code" src="./jetpack/TextView.xml"></main>
    </div>
 
</section>

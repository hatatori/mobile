<h1>&lt;Button/></h1>
<p>O Button é um componente do Android usado para criar botões interativos, permitindo que o usuário execute uma ação ao clicar, como enviar dados, abrir uma tela ou realizar uma operação.</p>

    
<hr>

<section class="options">

    <button class="btn btnOption" value="xml">XML</button>
    <button class="btn btnOption" value="jetpack">JETPACK</button>

    <div class="optionItem xml" style="display: block;">
        <h2>XML</h2>
        <main lang="xml" class="code" src=" \./xml/Button.xml"></main>
    </div>

    <div class="optionItem jetpack">
        <h2>JETPACK COMPOSE</h2>
        <main lang="kotlin" class="code" src=" \./jetpack/Button.kt"></main>
    </div> 
 
</section>

<h1>&lt;AlertDialog/></h1>
<p>Uma caixa de diálogo é uma pequena janela que leva o usuário a tomar uma decisão ou inserir mais informações. Elas não ocupam toda a tela e são normalmente usadas para eventos modais que exijam que usuários realizem uma ação antes de continuar.</p>

<h1>&lt;EditText/></h1>
<p>O EditText ( TextField ) é um componente do Android usado para permitir que o usuário digite e edite textos na tela, possibilitando
    personalizar aspectos como tipo de entrada, tamanho da fonte, cor, texto de exemplo e estilo.</p>

<!-- post -->
<section class="post">
    <h1>Linha e Coluna</h1>
    <p>`Row` e `Column` são usados para organizar elementos</p>
    <p>Linha ( Um elemento abaixo do outro )</p>
    <div class="bg1  post">
        <code class="kotlin">
Row(){
    Text("Cat")
    Text("Dog")
    Text("Fox")   
}
        </code>
    </div>
    <p>Coluna ( Um elemento do lado do outro ) </p>
    <div class="bg1  post">
        <code class="kotlin">
Column(){
    Text("Cat")
    Text("Dog")
    Text("Fox")   
}
        </code>
    </div>
</section>
